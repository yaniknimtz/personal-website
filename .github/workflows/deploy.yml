# Build the Hugo site and deploy it to GitHub Pages.
# Pushes to main deploy; pull requests only build (to catch errors early).
# Requires: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that is in progress.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned for reproducible builds. To upgrade, change the version and
      # check that `hugo --minify --panicOnWarning` still builds locally.
      HUGO_VERSION: 0.170.1
      TZ: Europe/Madrid
    steps:
      - name: Install Hugo (extended)
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSL "${base}/hugo_${HUGO_VERSION}_checksums.txt" | grep " ${file}\$" | sha256sum -c -
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xzf "${file}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          # The site's address on Pages: https://yaniknimtz.com once the custom
          # domain is set, https://<user>.github.io/<repo> before that.
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo version
          if [ -n "${BASE_URL}" ]; then
            hugo --gc --minify --panicOnWarning --baseURL "${BASE_URL}/"
          else
            hugo --gc --minify --panicOnWarning
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
